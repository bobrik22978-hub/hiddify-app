# Codemagic configuration for Bobrvpn (Flutter + Android)
# To use: connect repo at https://codemagic.io/app/ and select this file

workflows:
  bobrvpn-android:
    name: Bobrvpn Android Build
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      android_signing:
        - bobrvpn_keystore  # Upload keystore in Codemagic UI > Settings > Code Signing
      groups:
        - google_play_credentials
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Build APK
        script: |
          flutter build apk --release \
            --split-per-abi \
            --build-name=1.0.0 \
            --build-number=$(date +%s)
        
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(date +%s)
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      # Google Play (beta track) - uncomment and configure
      # google_play:
      #   credentials: $GOOGLE_PLAY_CREDENTIALS
      #   track: beta
      email:
        recipients:
          - $CM_EMAIL
